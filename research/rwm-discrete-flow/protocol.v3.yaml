retry_policy:
  max_attempts: 2
  allowed_reasons:
  - vm_died
  - infrastructure_interruption
  selection: first_valid_identical_attempt
  automatic_retries: false
support_criteria:
- The predeclared D1-versus-B0 engineering contrast meets all three meaningful-effect thresholds, both-seed direction
  rule and every noninferiority/stability/latency constraint on fresh data.
- Factorial conditional effects and interaction are reported on the same paired support, including D1 versus B1
  and E3 versus B2; no historical missing-cell imputation is used.
- Endpoint velocity accuracy is preserved independently of joint displacement, and accuracy improves beyond zero
  algebraic inconsistency or rendering changes.
contradiction_criteria:
- Complete valid prospective evidence misses a meaningful-effect target or fails articulation, autonomy, numerical
  or latency constraints; do not promote based only on the composite.
- Direct-head gains occur only in the integrated arm and fail to transfer to D1; retain that interaction as a negative
  result.
inconclusive_criteria:
- Fewer than two valid fresh training-seed pairs or an incomplete factorial prevent the planned replication.
- Provenance, population independence, action timing, checkpoint selection or common-support comparability cannot
  be verified.
- Population-level effects remain inconclusive with two seeds even if the descriptive engineering targets pass.
