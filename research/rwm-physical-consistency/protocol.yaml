- ASSUMPTION numerical training budget, seeds 11/22, immutable collection recipe, optimizer, validation
  checkpoint rule, diagnostics and fixed integration scheme are engineering/scientific proposals requiring
  independent Gate C.
- ASSUMPTION runtime and asset availability are unmeasured; hard GPU cap never expands for setup, failed
  attempts, timing or rendering.
- ASSUMPTION fixed nominal mechanics and deterministic simulator-prefix replay can be verified to 1e-4
  absolute/relative state/pose tolerance; mismatches invalidate shadow evidence.
- ASSUMPTION 16 stochastic test-ID streams use seeds 6100..6115 and only recorded actions; they do not
  create independent training replications.
- No confidence intervals across two seeds; episode/joint/time counts cannot replace training-seed replication.
- Repeated visualization is illustrative replay from fixed scored arrays and does not change scored populations.
- The historic policy run is failed; local checkpoint is finite and CPU policy/export parity passed. This
  does not relabel that run as complete.
