algorithm_repository: ../rsl_rl_rwm-agent-rwm-physical-consistency
algorithm_commit: a496265b17eddd442ecdc8885dce67e28349e170
resolved_differences:
  B0:
    transition: original residual prediction for all 45 independent normalized coordinates
    auxiliary: original separate GRU, teacher-forced auxiliary loss, mean inference
  B0_visual:
    parent: B0
    train: false
    transition: identical model/policy inputs and predictions; pose integration is an output-only consumer
    verification: model observations, actions and 45-state tensors must equal B0 exactly
  B1:
    parent: B0
    change: remove three independent gravity outputs; derive gravity from integrated predicted angular
      velocity
    independent_state_outputs: 42
  B2:
    parent: B1
    change: remove twelve independent joint-position outputs; integrate positions from next joint velocities
    independent_state_outputs: 30
    velocity_parameterization: residual
  B3_accel:
    parent: B2
    train: false
    change: 'Exact reparameterization of B2 output: acceleration = physical velocity residual / dt. Preserve
      normalized outputs, induced state variance, loss and all state updates. Run on both selected B2
      checkpoints (seeds 11 and 22) and prove functional equality. This is an E3 null control, not evidence
      for an acceleration inductive bias.'
  E3_direct_velocity:
    parent: B2
    change: Remove the residual skip only for the 18 linear/angular/joint velocity outputs. Predict absolute
      next velocities in the same normalized state units. All integrations, torque residuals, losses and
      training settings remain those of B2.
    rationale: provides the genuinely distinct direct-versus-residual comparison requested in E3
  B4:
    enabled: false
    gate: Separate A/C amendment only if E1/E2 improve ground-truth error and held-out diagnostics attribute
      at least 30 percent of squared physical error to frames within two control steps of true contact
      transitions. Correlation alone does not establish causation. Decide penalty definitions/weights
      before new training.
  E5_predictor_corrector:
    enabled: false
    gate: separately framed and approved comparison, including staged-training cost and latency
architecture:
  type: gru
  layers: 2
  hidden_units: 256
  separate_auxiliary_backbone: true
  head_hidden_units: 128
implementation_scope: Model module, immutable fixed-data adapter and explicitly separate world-model scoring
  over the existing train.py/play.py and queue APIs. Existing RL paths preserved.
verification:
  cpu_suite: 272 passed, 1 pre-existing matplotlib open-figure warning; PYTHONPATH=src:<algorithm-worktree>
    python -m pytest tests/test_research_*.py -q
  policy_forward: stock ActorCritic, frozen boundary and traced actor agree bitwise on CPU
  simulator_smoke: Not launched; requires Gate C and is charged to the same GPU budget
  checkpoint: Structured dynamics checkpoints carry construction metadata, training source and protocol;
    old policy interface unchanged
  export: Frozen actor TorchScript parity checked; recurrent dynamics export is unsupported in this campaign;
    inference is Python/Torch without a simulator
  pre_commit: All applicable hooks passed on every changed file; sibling module Black formatted.
  construction: All four variants instantiate with original MBPOPPO; Adam lr .001, weight decay 0; no
    optimizer updates performed during verification.
  cpu_interpreter: Use the rwm-derived runtime-check-env with Torch 2.5.1 and tensordict; exact reviewed
    command in Gate B handoff. Base Python lacks tensordict.
  technical_repair: Eight new CPU regression cases cover raw-array/record preservation, population aliases,
    real physics mismatches, immutable-manifest protection and resume provenance. No simulator or optimizer
    update.
  device_placement: Eight CPU cases verify inherited visibility removal, physical PCI order, CPU/cuda:2/cuda:3
    selection before train/score model construction, and explicit timing synchronization/memory devices
    without allocating CUDA.
limitations:
- Only two independent training seeds; no aggregate confidence interval or population-support claim.
- USD frame extraction must agree with actual initial foot-link coordinates within 2 mm before collection
  continues.
- Scored arrays are authoritative; kinematic videos are explicitly illustrative replays, never new scored
  populations.
