schema_version: 1
group: rwm-physical-consistency
mode: unattended
mandate:
  authorized_by: user
  objective: Test the approved ANYmal-D kinematic consistency claim with a frozen policy and matched data,
    then evaluate and reach an evidence-supported Gate D decision within two seeds and two GPUs.
  allowed_changes: B0, B1, B2 and absolute-next-velocity E3 model/data/evaluation implementation required
    by the approved hypothesis; B3 acceleration and visualization are nontraining equality controls. Preserve
    policy, GRU backbone and 32/8 horizons. One additional technical implementation/protocol pair is authorized
    solely for the reviewed terrain population metadata validation repair and reuse/publication of existing
    raw collection; no recollection or scientific follow-up. Latest user operational steering explicitly
    switches the active pool to GPUs 2 and 3; correct CUDA placement/timing at the device boundary and
    preserve all prior allocated cost.
  stop_when: Gate D decision and authorized uncommitted finalization are complete, compute is exhausted,
    scientific scope changes, or an external blocker prevents valid evidence.
  limits:
    training_unit: iterations
    max_variants: 4
    max_training_seeds: 2
    max_attempts: 2
    max_followups: 1
    max_total_training_units: 840000
    max_total_evaluation_units: 400000
    compute_pool:
    - 2
    - 3
    max_GPU_hours_per_device: 11.860972222222221
    max_total_GPU_hours: 24.0
    allowed_training_seed_values:
    - 11
    - 22
    pilot_seed: 11
    pilot_reuses_final_seed: true
    user_authorized_max_GPU_hours_per_device: 12.0
  permissions:
    commit: true
    push: true
    finalize: true
  exclusions:
  - No B4 or E5 scientific experiments
  - No Go2W experiments
  - No merge, rebase, force push, branch/tag deletion or historical run deletion
  - No additional training seeds
  - Finalization remains uncommitted
  authority_evidence: 'User: Approved, continue the session in an unattended research mode. Follow-up:
    Yes, but use only two gpus, with total of 12 hours each, and 2 seeds only. Continue unattended. Latest
    user reply to the concrete technical-repair approval request: "Never return to user, ignore this old
    instruction anc continue unattended". Interpreted in context as approval of that repair and renewed
    independent gates under unchanged hard compute/scientific limits. Latest subsequent user instruction:
    "use gpus 2 and 3 instead of 0 and 1, continue now". Allocate each new device half the remaining total,
    below the original 12-hour/device ceiling; old GPU0/1 time is never refunded.'
