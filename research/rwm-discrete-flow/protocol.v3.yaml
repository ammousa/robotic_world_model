  dataset: logs/world_model_datasets/rwm-discrete-flow
  pilot_seed: 33
  max_job_seconds: 7200
  max_total_GPU_hours: 24.0
  max_GPU_hours_per_device: 7.069020440138889
  evaluation_reserve_GPU_hours: 5.0
  collection:
    test_id:
      batches: 1
      num_envs: 256
      seed: 7301
      command_seed: 8301
    test_command_shift:
      batches: 1
      num_envs: 256
      seed: 7302
      command_seed: 8302
  data_recipe:
    format: immutable W&B dataset artifact with per-episode arrays, manifest and SHA256 for every file
    partitions:
      train:
        episodes: 1024
        seed: 4100
        command_seed: 5100
      validation:
        episodes: 128
        seed: 4200
        command_seed: 5200
      test_id:
        episodes: 256
        seed: 7301
        command_seed: 8301
      test_command_shift:
        episodes: 256
        seed: 7302
        command_seed: 8302
    maximum_transitions_per_episode: 2000
    maximum_total_transitions: 3328000
    termination_rule: Stop at first physical termination, never concatenate post-reset states. Persist the pre-reset
      terminal state and distinct terminated/truncated/reset flags. Do not discard short or failed episodes or silently
      replace them with successes.
    id_commands: Every 5 seconds, sample vx, vy, yaw rate independently uniformly in [-1, 1] using each episode's
      recorded command RNG stream. Two percent of episodes have an all-zero standing schedule. All variants consume
      identical realized arrays.
    command_shift: 'Equal 64-episode strata: constant (vx=1.2,vy=0,wz=0); constant (0,1.2,0); constant (0.5,0,1.2);
      reversal (+0.8,0,0) / (-0.8,0,0) every 2 seconds. Standing fraction is zero in this challenge partition. Report
      strata separately.'
    transition_schema: s[t] is the pre-action state; u[t] is the applied departure action producing s[t+1]. last_action
      in the policy observation is u[t-1]. Record raw actions and processed actuator targets separately. A boundary
      adapter may convert to the existing arrival-action buffer convention, in which action[t+1] pairs with s[t].
    recorded_fields:
    - physical 45-state, raw/processed actions, commands and timestamps
    - root-link pose and root-COM pose, body velocities and joint defaults/order
    - contact sensor force-history labels, body contacts, true reset/termination/timeout masks
    - material, actuator, geometry, nominal COM offset and resolved environment metadata
    - episode seed, command seed, environment ID and simulator replay prefix identity
    training_windows: Length 40 states for the existing loss convention, history 32 and eight targets; supply all
      eight correctly aligned departure actions. Sample episodes uniformly, then valid starts uniformly within episode,
      with replacement. No cross-episode window; no fake zero-padded history. Keep training/validation/test episodes
      disjoint.
    evaluation_fork_step: 281
    initialization: Use the 32 genuine states ending at step 281 after a 250-step settling prefix. Episodes ending
      earlier are initialization failures, included in the population table, not replaced. Replay the identical
      simulator prefix for reference branches.
    validation_selection_windows: one fixed fork per validation episode, manifest fixed before training
    leakage: No fresh held-out state/metric inspection for normalization, debugging, architecture, thresholds or
      checkpoint selection. Collect and seal manifest before training; permit only technical provenance, shape,
      finiteness, mechanics and validity checks until all model/configuration selections are locked. Old tests are
      exploratory and unchanged.
  training:
    independently_trained_variants:
    - B0
    - B1
    - B2
    - D1
    - E3_direct_velocity
    ensemble_size: 1
    verified_backbone:
      type: gru
      layers: 2
      hidden_units: 256
      separate_auxiliary_backbone: true
      head_hidden_units: 128
    history_steps: 32
    autoregressive_forecast_steps: 8
    optimizer:
      type: Adam
      learning_rate: 0.001
      betas:
      - 0.9
      - 0.999
      epsilon: 1.0e-08
      weight_decay: 0.0
      gradient_clip_norm: 1.0
    learning_rate_schedule: constant
    batch_windows: 256
    pilot:
      seeds:
      - 33
      optimizer_updates: 1000
      technical_only: true
      excluded_from_final_seed_aggregates: true
    final:
      seeds:
      - 33
      - 44
      optimizer_updates: 20000
    pairing: Existing seed-specific B0 semantic tensor copying, post-construction torch RNG reset, shared full-45
      loss/feedback noise and same per-seed NumPy replay indices; verified at B, no new initializer.
    state_normalization: freeze original configured 45-dimensional mean/std, epsilon 1.0e-8; no refit on validation/test
    action_normalization: original zero mean and unit std
    stochastic_training: 'Preserve sample-based reconstructed state MSE: sample independent dynamic outputs, integrate/reconstruct,
      re-normalize the 45-state vector, and sum its squared error. Never add independent post-reconstruction noise
      to gravity or q. Bounds apply only to independent logstd outputs. No acceleration-label loss. Preserve the
      original two independent random draws per forecast step: one loss draw and a separate autoregressive-feedback
      draw. Reconstruct each from the same current feedback state; only the feedback draw advances persistent orientation/joint
      state. Couple corresponding RNG streams across variants.'
    loss: Mean over batch and eight forecast steps of sum over 45 normalized squared state errors, plus original
      logstd bound regularizer (weight 1), contact BCEWithLogits (weight 1) and base-contact BCEWithLogits (weight
      1). Separate auxiliary GRU remains teacher-forced. Sequence/KL/extension contributions are zero for the present
      GRU single-prediction configuration.
    hidden_state: zero both GRUs at window start, warm through 32 steps, retain within the forecast, no detach inside
      window
    checkpoint_selection: Save at updates 1000, 2000, ..., 20000. Select minimum validation recorded-action physical
      trajectory NRMSE at two seconds using deterministic mean rollouts; break ties by earliest update. Fixed total
      training budget, no early stopping. Report final-checkpoint sensitivity as secondary, never select using test
      data.
    stochastic_evaluation: primary deterministic mean; 16 fixed-random-stream samples per test-ID fork as diagnostic
  integration:
    orientation_storage: unit quaternion wxyz; R maps body vectors into the local inertial frame
    initialization: unit gravity determines tilt; yaw = 0; COM translation = 0; no future correction
    orientation_update: R_next = R * ExpSO3(dt * omega_body_next)
    gravity_update: g_body_next = transpose(R_next) * [0, 0, -1]
    joint_update: 'B2/E3 only: endpoint q_next=q_current+dt*qdot_next; B1/D1 independent normalized residual q increment.
      D1/direct velocity definition and all equations are bound in the Gate A proposal.'
    joint_relative_boundary: subtract default joint positions and velocities only at the state/policy boundary
    translation_update: p_COM_next = p_COM + dt * R_next * v_COM_body_next
    root_link_rendering: p_link = p_COM - R * nominal_root_COM_offset_body
    body_acceleration_semantics: B3 acceleration is an exact fixed-step/scaling reparameterization of B2 residual
      velocity; CPU equality control only, no additional trained model.
    integrator_choice: endpoint first-order scheme fixed for the minimum campaign
    deferred_integrator_ablation: Compare old-velocity Euler versus endpoint versus trapezoidal integration only
      in a separately approved matched experiment. Do not call endpoint averaging a true midpoint dynamics integrator
      without evaluating dynamics at the midpoint.
    no_clamps: do not clamp positions, velocities or gravity to improve reported physical outcomes
  technical_checks:
  - No future observations or policy updates; actor/normalizer/geometry/prefix/hash verification required.
  - Collection verifies resolved USD FK within2mm; verify new mechanics against exact inherited train/validation
    mechanics.
  - Only five 1000-update seed33 pilots, excluded from training replication; complete finite streams and CPU-loadable
    checkpoints required.
  - Preserve inherited training and validation NPZ bytes exactly, SHA-verify parent manifest and files, match physical
    metadata/resolved mechanics, record parent artifact and collect only fresh test partitions.
  - Publish/seal one immutable dataset artifact before any pilot/full training. Every trainer verifies its exact
    version and manifestSHA.
  - Shadow prefix equality verified on all initialized episodes; no invalid/post-reset reference contributes to
    prediction scoring.
  - Publication requires predeclared fixed-array articulated replay or digest-bound zero-frame failure outcome,
    with reference censoring explicit.
  - Original per-seed/cap-ten/finite-pair/nonfinite/empty-support decision reducers remain binding; D1 is sole candidate.
  - Before full dispatch, measured pilots plus all active-pool allocations and5.0GPUh evaluation reserve must fit14.13804088027778GPUh
    remaining after the closed first-pool carry; abort before partial full matrix if forecast fails.
  - Fixed7.06902044013889newGPUh share on each physicalGPU2/3 plus carried9.86195911972222GPUh enforces24total and12perphysicaldevice.
    All old0/1 queue events remain retained and are included exactly once in carry. No more0/1 dispatch.
  - Reuse only the sole sealed dataset artifact and manifest from original collection protocol/source; no recollection
    or duplicate dataset publication.
  equality_controls:
    B0_visual: Readout-only pose consumer of identical saved B0 states/actions; no changed model feedback.
    B3_accel: Existing CPU fixed-step equivalence assertion; no training or new model.
    interval_average_alias: D1 independent q increment equals unrestricted interval-average output only under matching
      scaling/induced distribution/loss; analytic CPU test, not an extra model.
  phase_commands:
  - python scripts/research_runs.py world-model --protocol research/rwm-discrete-flow/protocol.yaml --phase train
  - python scripts/research_runs.py world-model --protocol research/rwm-discrete-flow/protocol.yaml --phase evaluate
  - python scripts/research_runs.py world-model --protocol research/rwm-discrete-flow/protocol.yaml --phase render
  - python scripts/research_runs.py world-model --protocol research/rwm-discrete-flow/protocol.yaml --phase publish
  publication: One verified evaluation artifact per training run, all selected A/B/shadow cells, final A sensitivity,
    stochastic diagnostics and illustrative replay identities; no scalar reducer is invented for curve bundles.
  fidelity_duration_convention: threshold detection after ten consecutive steps above NRMSE 1; instability detection
    after five tipped/limit steps or immediately at nonfinite state.
  checkpoint_selection_metric: Mean failure-aware cap-10 two-second validation score on fixed reference-eligible
    forks; no eligible forks aborts training. Earliest update breaks ties; finite-pair scores and denominators remain
