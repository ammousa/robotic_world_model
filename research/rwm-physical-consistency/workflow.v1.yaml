schema_version: 1
group: rwm-physical-consistency
mode: unattended
mandate:
  authorized_by: user
  objective: Test the approved ANYmal-D kinematic consistency claim with a frozen
    policy and matched data, then evaluate and reach an evidence-supported Gate D
    decision within two seeds and two GPUs.
  allowed_changes: B0, B1, B2 and absolute-next-velocity E3 model/data/evaluation
    implementation required by the approved hypothesis; B3 acceleration and visualization
    are nontraining equality controls. Preserve policy, GRU backbone and 32/8 horizons.
  stop_when: Gate D decision and authorized uncommitted finalization are complete,
    compute is exhausted, scientific scope changes, or an external blocker prevents
    valid evidence.
  limits:
    training_unit: iterations
    max_variants: 4
    max_training_seeds: 2
    max_attempts: 2
    max_followups: 0
    max_total_training_units: 840000
    max_total_evaluation_units: 400000
    compute_pool:
    - 0
    - 1
    max_GPU_hours_per_device: 12.0
    max_total_GPU_hours: 24.0
    allowed_training_seed_values:
    - 11
    - 22
    pilot_seed: 11
    pilot_reuses_final_seed: true
  permissions:
    commit: true
    push: true
    finalize: true
  exclusions:
  - No B4 or E5 scientific experiments
  - No Go2W experiments
  - No merge, rebase, force push, branch/tag deletion or historical run deletion
  - No additional training seeds
  - Finalization remains uncommitted
  authority_evidence: 'User: Approved, continue the session in an unattended research
    mode. Follow-up: Yes, but use only two gpus, with total of 12 hours each, and
    2 seeds only. Continue unattended.'
