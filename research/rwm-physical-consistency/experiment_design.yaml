schema_version: 1
kind: experimental_design_proposal
group: rwm-physical-consistency
project: rwm-explore
entity: oxdynamics
status: gate_A_approved_implementation_pending
scientific_values: 'Original proposals with explicit user mandate: two training seeds
  only, two GPUs, at most 12 GPU-hours per GPU'
branch_for_future_work: dev/agent/rwm-physical-consistency
scope: Frame and protocol design only; no implementation, collection, training or
  evaluation execution.
execution_blockers:
- Gate A is pending; this design is not an approved protocol.yaml.
- Existing Pretrain jointly trains PPO and collects changing-policy data; it does
  not express this frozen-data campaign.
- Existing offline model_based/train.py trains a policy, not a world model on a fixed
  dataset.
- Existing play.py/check-eval score policy episodes, not fixed world-model trajectories.
- After A, implement the smallest reusable model/data/evaluation extensions and review
  actual source and overrides at B.
- Gate C must bind exact supported commands, immutable dataset artifacts, source commits
  and resource limits.
- Create the comparison worktree through research_runs.py worktree before implementation;
  preserve all current user files.
frozen_policy:
  candidate_checkpoint: logs/rsl_rl/anymal_d_flat/2026-10-20_12-35-43_pre/model_850.pt
  sha256: 630a6e4394314a7e96c3844e3b5735e9f730617e23e0db4f53fea440ed2e2578
  historical_wandb_run: n35fovhl
  historical_run_state: failed
  qualification: Final local checkpoint exists with finite tensors; failed W&B state
    is preserved. Do not relabel as a successful fresh training run. Gate B must qualify
    the policy by stock Play loading/forward checks; Gate C pins an immutable checkpoint
    artifact.
  action_selection: deterministic actor mean, no sampling or observation noise in
    collection or evaluation
  observation_order:
  - body_linear_velocity
  - body_angular_velocity
  - gravity
  - command_xyz_yawrate
  - joint_position_relative
  - joint_velocity_relative
  - previous_raw_action
  observation_dim: 48
  policy_normalization: none in this candidate; verify against saved config and loaded
    model
  action_dim: 12
  action_units: raw position command; physical target = default_joint_position + 0.5
    * raw_action
  action_clipping: none in saved runner config; preserve and log wrapper processing
mechanics:
  simulator_task: Isaac-Velocity-Flat-Anymal-D-Play-v0
  simulation_dt_s: 0.005
  control_decimation: 4
  model_dt_s: 0.02
  episode_length_s: 40
  terrain: flat plane
  events: disable pushes, external forces, base-mass randomization and base-COM randomization
    in every partition
  material_and_robot: fixed saved nominal settings, ANYmal-D ANYdrive-3 LSTM actuator;
    persist exact resolved assets and geometry
  command_mode: explicit body vx, vy, yaw-rate schedule; heading controller disabled
    in every partition
  policy_and_system_observation_corruption: false
  held_out_environment_definition: disjoint environment and episode RNG streams; same
    fixed nominal mechanics in ID
  generalization_scope: unseen episodes and command combinations; no terrain, robot
    or mechanical-parameter transfer claim
data:
  format: immutable W&B dataset artifact with per-episode arrays, manifest and SHA256
    for every file
  partitions:
    train:
      episodes: 1024
      seed: 4100
      command_seed: 5100
    validation:
      episodes: 128
      seed: 4200
      command_seed: 5200
    test_id:
      episodes: 256
      seed: 4300
      command_seed: 5300
    test_command_shift:
      episodes: 256
      seed: 4400
      command_seed: 5400
  maximum_transitions_per_episode: 2000
  maximum_total_transitions: 3328000
  termination_rule: Stop at first physical termination, never concatenate post-reset
    states. Persist the pre-reset terminal state and distinct terminated/truncated/reset
    flags. Do not discard short or failed episodes or silently replace them with successes.
  id_commands: Every 5 seconds, sample vx, vy, yaw rate independently uniformly in
    [-1, 1] using each episode's recorded command RNG stream. Two percent of episodes
    have an all-zero standing schedule. All variants consume identical realized arrays.
  command_shift: 'Equal 64-episode strata: constant (vx=1.2,vy=0,wz=0); constant (0,1.2,0);
    constant (0.5,0,1.2); reversal (+0.8,0,0) / (-0.8,0,0) every 2 seconds. Standing
    fraction is zero in this challenge partition. Report strata separately.'
  transition_schema: s[t] is the pre-action state; u[t] is the applied departure action
    producing s[t+1]. last_action in the policy observation is u[t-1]. Record raw
    actions and processed actuator targets separately. A boundary adapter may convert
    to the existing arrival-action buffer convention, in which action[t+1] pairs with
    s[t].
  recorded_fields:
  - physical 45-state, raw/processed actions, commands and timestamps
  - root-link pose and root-COM pose, body velocities and joint defaults/order
  - contact sensor force-history labels, body contacts, true reset/termination/timeout
    masks
  - material, actuator, geometry, nominal COM offset and resolved environment metadata
  - episode seed, command seed, environment ID and simulator replay prefix identity
  training_windows: Length 40 states for the existing loss convention, history 32
    and eight targets; supply all eight correctly aligned departure actions. Sample
    episodes uniformly, then valid starts uniformly within episode, with replacement.
    No cross-episode window; no fake zero-padded history. Keep training/validation/test
    episodes disjoint.
  evaluation_fork_step: 281
  initialization: Use the 32 genuine states ending at step 281 after a 250-step settling
    prefix. Episodes ending earlier are initialization failures, included in the population
    table, not replaced. Replay the identical simulator prefix for reference branches.
  validation_selection_windows: one fixed fork per validation episode, manifest fixed
    before training
  leakage: no test use for normalization, training, checkpoint selection, debugging
    or variant changes
variants:
  B0:
    transition: original residual prediction for all 45 independent normalized coordinates
    auxiliary: original separate GRU, teacher-forced auxiliary loss, mean inference
  B0_visual:
    parent: B0
    train: false
    transition: identical model/policy inputs and predictions; pose integration is
      an output-only consumer
    verification: model observations, actions and 45-state tensors must equal B0 exactly
  B1:
    parent: B0
    change: remove three independent gravity outputs; derive gravity from integrated
      predicted angular velocity
    independent_state_outputs: 42
  B2:
    parent: B1
    change: remove twelve independent joint-position outputs; integrate positions
      from next joint velocities
    independent_state_outputs: 30
    velocity_parameterization: residual
  B3_accel:
    parent: B2
    train: false
    change: 'Exact reparameterization of B2 output: acceleration = physical velocity
      residual / dt. Preserve normalized outputs, induced state variance, loss and
      all state updates. Run on both selected B2 checkpoints (seeds 11 and 22) and
      prove functional equality. This is an E3 null control, not evidence for an acceleration
      inductive bias.'
  E3_direct_velocity:
    parent: B2
    change: Remove the residual skip only for the 18 linear/angular/joint velocity
      outputs. Predict absolute next velocities in the same normalized state units.
      All integrations, torque residuals, losses and training settings remain those
      of B2.
    rationale: provides the genuinely distinct direct-versus-residual comparison requested
      in E3
  B4:
    enabled: false
    gate: Separate A/C amendment only if E1/E2 improve ground-truth error and held-out
      diagnostics attribute at least 30 percent of squared physical error to frames
      within two control steps of true contact transitions. Correlation alone does
      not establish causation. Decide penalty definitions/weights before new training.
  E5_predictor_corrector:
    enabled: false
    gate: separately framed and approved comparison, including staged-training cost
      and latency
integration:
  orientation_storage: unit quaternion wxyz; R maps body vectors into the local inertial
    frame
  initialization: unit gravity determines tilt; yaw = 0; COM translation = 0; no future
    correction
  orientation_update: R_next = R * ExpSO3(dt * omega_body_next)
  gravity_update: g_body_next = transpose(R_next) * [0, 0, -1]
  joint_update: q_absolute_next = q_absolute + dt * qdot_absolute_next
  joint_relative_boundary: subtract default joint positions and velocities only at
    the state/policy boundary
  translation_update: p_COM_next = p_COM + dt * R_next * v_COM_body_next
  root_link_rendering: p_link = p_COM - R * nominal_root_COM_offset_body
  body_acceleration_semantics: B3 uses component derivative d(v_body)/dt, not an IMU
    specific force or inertial acceleration. A physical force model would require
    d(v_body)/dt = R^T a_world - omega_body cross v_body. That different force-model
    ablation is outside this campaign.
  integrator_choice: endpoint first-order scheme fixed for the minimum campaign
  deferred_integrator_ablation: Compare old-velocity Euler versus endpoint versus
    trapezoidal integration only in a separately approved matched experiment. Do not
    call endpoint averaging a true midpoint dynamics integrator without evaluating
    dynamics at the midpoint.
  no_clamps: do not clamp positions, velocities or gravity to improve reported physical
    outcomes
training:
  independently_trained_variants:
  - B0
  - B1
  - B2
  - E3_direct_velocity
  ensemble_size: 1
  verified_backbone:
    type: gru
    layers: 2
    hidden_units: 256
    separate_auxiliary_backbone: true
    head_hidden_units: 128
  history_steps: 32
  autoregressive_forecast_steps: 8
  optimizer:
    type: Adam
    learning_rate: 0.001
    betas:
    - 0.9
    - 0.999
    epsilon: 1.0e-08
    weight_decay: 0.0
    gradient_clip_norm: 1.0
  learning_rate_schedule: constant
  batch_windows: 256
  pilot:
    seeds:
    - 11
    optimizer_updates: 1000
    technical_only: true
    excluded_from_final_seed_aggregates: true
  final:
    seeds:
    - 11
    - 22
    optimizer_updates: 20000
  pairing: same per-seed data-window/bootstrap index streams; same shared-shape initial
    weights; explicit random-stream manifests
  state_normalization: freeze original configured 45-dimensional mean/std, epsilon
    1.0e-8; no refit on validation/test
  action_normalization: original zero mean and unit std
  stochastic_training: 'Preserve sample-based reconstructed state MSE: sample independent
    dynamic outputs, integrate/reconstruct, re-normalize the 45-state vector, and
    sum its squared error. Never add independent post-reconstruction noise to gravity
    or q. Bounds apply only to independent logstd outputs. No acceleration-label loss.
    Preserve the original two independent random draws per forecast step: one loss
    draw and a separate autoregressive-feedback draw. Reconstruct each from the same
    current feedback state; only the feedback draw advances persistent orientation/joint
    state. Couple corresponding RNG streams across variants.'
  loss: Mean over batch and eight forecast steps of sum over 45 normalized squared
    state errors, plus original logstd bound regularizer (weight 1), contact BCEWithLogits
    (weight 1) and base-contact BCEWithLogits (weight 1). Separate auxiliary GRU remains
    teacher-forced. Sequence/KL/extension contributions are zero for the present GRU
    single-prediction configuration.
  hidden_state: zero both GRUs at window start, warm through 32 steps, retain within
    the forecast, no detach inside window
  checkpoint_selection: Save at updates 1000, 2000, ..., 20000. Select minimum validation
    recorded-action physical trajectory NRMSE at two seconds using deterministic mean
    rollouts; break ties by earliest update. Fixed total training budget, no early
    stopping. Report final-checkpoint sensitivity as secondary, never select using
    test data.
  stochastic_evaluation: primary deterministic mean; 16 fixed-random-stream samples
    per test-ID fork as diagnostic
evaluation:
  horizons_steps:
  - 10
  - 50
  - 100
  - 250
  - 500
  - 1500
  horizons_seconds:
  - 0.2
  - 1
  - 2
  - 5
  - 10
  - 30
  roles:
  - short_dynamics
  - initial_autonomous
  - medium_fidelity
  - long_accuracy
  - extended_accuracy
  - stability_stress
  levels: []
  difficulties: []
  partitions:
  - test_id
  - test_command_shift
  population: one fixed fork per held-out episode; 256 planned episode IDs per partition
  modes:
    A: same recorded future departure actions for every model, open loop after the
      initial history
    B: Same frozen actor and initial history, each model's predicted observation drives
      its own future actions. Compare with a simulator branch using the same frozen
      actor on true observations. Report trajectory gaps as closed-loop outcome discrepancies,
      never as identical-action prediction errors.
    B_shadow: Replay each B branch's complete generated action sequence in the simulator,
      reconstructed by deterministic replay of the identical pre-fork prefix. Compare
      that model with its own action-matched simulator reference; do not rank these
      as though every variant received the same future action sequence.
  no_future_corrections: no periodic history refresh, pose alignment, true contacts
    or simulator state injection after the fork
  alignment: One initial translation and yaw alignment only. Compute initial tilt
    from measured gravity, then integrate. Apply the initial transform once to the
    entire trajectory. Score COM translation against ground-truth COM; score link
    translation separately using fixed nominal COM offset. Ground-plane height is
    not observable from this input and is not a model correction.
  physical_score: 'For each fork and K, sqrt(mean over k=1..K of mean of six blocks:
    ||p_COM_hat-p_COM||^2/(1 m)^2; geodesic(R_hat,R)^2/(1 rad)^2; ||v_body_hat-v_body||^2/(1
    m/s)^2; ||omega_body_hat-omega_body||^2/(1 rad/s)^2; mean_j (q_hat-q)^2/(0.5 rad)^2;
    mean_j (qdot_hat-qdot)^2/(5 rad/s)^2)). Average forks equally within partition
    and seed, then seeds equally.'
  physical_metrics:
  - COM_and_link_translation_RMSE_m
  - orientation_geodesic_RMSE_rad
  - roll_pitch_error_rad
  - gravity_RMSE
  - body_linear_velocity_RMSE_m_s
  - body_angular_velocity_RMSE_rad_s
  - joint_position_RMSE_rad
  - joint_velocity_RMSE_rad_s
  - torque_RMSE_Nm
  - per_fork_trajectory_NRMSE_p90_p95
  consistency_metrics:
  - joint_endpoint_integration_defect_rad
  - gravity_transport_defect
  - gravity_norm_error
  - gravity_versus_pose_defect
  - quaternion_norm_error
  - R_transpose_R_error
  - determinant_R_error
  - joint_limit_excess_rad
  - contact_transition_F1
  - nominal_plane_FK_foot_penetration_m
  - predicted_support_foot_speed_m_s
  behaviour_metrics:
  - linear_and_yaw_command_tracking_RMSE
  - gait_frequency_Hz
  - per_leg_phase_error_without_time_warp
  - joint_amplitude_error
  - foot_contact_duty_factor
  - unstable_fraction
  - numerical_divergence_fraction
  - stable_duration_s
  - exact_fidelity_duration_s
  instability: First nonfinite prediction, absolute roll or pitch above pi/3 for five
    consecutive steps, or any joint exceeding its hard asset limit by 0.25 rad for
    five consecutive steps. Report predicted base-contact events separately (threshold
    sigmoid >= 0.5), and do not equate that label with true falls.
  fidelity_duration: first time physical trajectory NRMSE exceeds 1.0 for ten consecutive
    steps; descriptive threshold only
  censoring: Stop exact physical metrics at the first true reference termination;
    never compare against a post-reset state. Report each horizon's eligible and finite
    denominators, initialized population, failures, and paired common support. Model-invalid
    values are failures, never silently excluded as complete cases. Report the failure-aware
    capped physical score (cap 10, including invalid model samples) alongside finite-pair
    RMSE. Support requires no increased failure rate and improvement in both views.
    Initial/reference failure is not assigned zero error. Thirty-second stability
    is always reported separately.
  footprint_diagnostic_limit: Relative plane penetration uses the initial plane offset
    for scoring only; absent root height makes absolute terrain contact underobserved.
    Label nominal geometry and gravity-only support proxies explicitly; neither proves
    force balance.
  baseline_pose_readout: For B0, use the same angular-velocity integration for primary
    pose scoring; additionally report gravity-derived tilt with integrated yaw as
    a separate state-readout diagnostic. Never privilege one variant with a different
    pose integrator.
  efficiency: One specified device/dtype, warm 1000 calls, time 10000 steps with synchronization;
    report median/p95/p99 batch-one model and model-plus-frozen-policy latency, batch-256
    throughput, peak allocated memory, training wall time and GPU-hours. Render cost
    and collection cost separately. No simulator loaded in neural timing.
statistics:
  primary_contrast: B2 versus B0 on test_id, mode A, two-second physical trajectory
    score
  mechanism_contrasts:
  - B1 versus B0
  - B2 versus B1
  - E3_direct_velocity versus B2
  acceleration_contrast: B3_accel versus B2 is an equality control with no distinct
    scientific hypothesis
  effect: mean across seeds of paired per-seed relative improvement 1 - variant_score
    / baseline_score
  interval: 'suppressed: only two user-authorized training seed pairs; retain raw
    paired effects'
  denominator_rule: do not form relative effects when matched baseline mean <= 1.0e-8;
    report absolute effect and inconclusive relative criterion
  minimum_ci_seed_pairs: 5
  minimum_improving_seeds: 2
  multiplicity: one predeclared primary contrast; mechanism, horizon, OOD and behavioural
    contrasts are descriptive with no multiplicity-adjusted claims
  no_pseudoreplication: never count overlapping windows, joints, timesteps or environments
    as independent training replications
  incomplete_evidence: preserve all attempts, show raw seed effects, mark incomplete/inconclusive;
    never invent a missing seed or interval
visualization:
  reuse: existing model parsing, articulated assets, command arrows and plotting conventions
  required_boundary: learned states and deterministic kinematics only; kinematic mesh
    playback must never call sim.step to evolve predictions
  state_source: immutable saved scored trajectories, timestamps, episode IDs, action
    sequences and checkpoint digests
  selection: four fixed ID episode IDs [0, 64, 128, 192], seed 11; add the worst B0
    two-second episode and retain failures
  outputs:
  - time_aligned_actual_imagined_articulation
  - translation_and_geodesic_error_curves
  - joint_angle_velocity_curves
  - consistency_versus_horizon
  - side_by_side_B0_B1_B2_B3_accel_and_E3_direct
  intervention_control: B0_visual must change only displayed pose, never future state
    or policy observations
  future_interface: time_s, local_position, quaternion_wxyz, physical_joint_angles,
    physical_joint_velocities, joint_names, command, raw_action, contact_logits, failure_flags
costs_and_retries:
  proposed_gpu_pool:
  - 0
  - 1
  availability: Two-device pool authorized by user; actual availability must be checked
    before launch
  final_training_runs: 8
  pilot_training_runs: 4
  final_max_GPU_hours_per_run: 2.0
  pilot_max_GPU_hours_per_run: 0.25
  data_collection_max_GPU_hours: 1.0
  evaluation_max_GPU_hours: 6.0
  total_proposed_max_GPU_hours: 24.0
  enforcement: external scheduler per-job wall-time limits, one GPU per job, no silent
    extension
  retry_policy: At most one identical infrastructure retry per cell, within the SAME
    total GPU-hour cap; retain failed attempts and choose first valid identical attempt.
    Numerical failure is a scientific failure, not an infrastructure retry.
  unknowns: no measured runtime, memory sufficiency or inference performance for these
    variants
  allocation_rule: if pilot/cost forecast cannot fit approved full campaign, stop
    and amend C before any partial final campaign
  hard_max_GPU_hours_per_device: 12.0
approval_handoff:
  now: Independent researcher approved revised Gate A on user-authorized two-seed
    mandate
  next: implementation verification and reviewed exact overrides at Gate B
  before_compute: supported protocol.yaml, immutable policy/data IDs, executable commands,
    source commits and budgets at Gate C
  after_results: review evidence before researcher Gate D; no automatic winner or
    migration
