    training_formula: (20000 full + 1000 smoke) * 5 variants * 2 training seeds * 2 attempts
    training_units: 420000
    actual_planned_pilots: Five seed-33 pilots; the generic formula conservatively reserves ten before retries.
    evaluation_unit: Configured episode or displayed articulated body per replay; horizons share each generated
      trajectory and are not separate populations.
    all_attempt_evaluation_ledger:
      selected_and_final_scoring:
        formula: 10 models * 2 attempts * 8 cells * 256 episodes
        units: 40960
      stochastic_recorded_action_streams:
        formula: 10 models * 2 attempts * 16 streams * 256 ID episodes
        units: 81920
      full_run_checkpoint_validation:
        formula: 10 models * 2 attempts * 20 checkpoints * 128 episodes
        units: 51200
      conservative_pilot_validation:
        formula: 10 generic pilots * 2 attempts * 128 episodes
