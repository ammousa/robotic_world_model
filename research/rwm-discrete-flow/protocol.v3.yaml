evaluation:
  primary_metric:
    name: failure_aware_recorded_action_physical_trajectory_nrmse_2s
    direction: lower
    unit: dimensionless six-block SI-scaled trajectory score, cap ten for model-invalid samples
  secondary_metrics:
  - Finite-pair trajectory score and all physical components at 0.2/1/2/5/10/30 seconds.
  - Joint-position and endpoint joint-velocity RMSE separately; body linear/angular velocity and pose accuracy.
  - Direct/residual main effect, integration main effect and their interaction, each per fresh training seed.
  - Autonomous policy outcomes and candidate-specific action-matched simulator shadows, with distinct interpretations.
  - First major error, error growth, stability duration, command tracking and numerical divergence.
  - Model and policy-plus-model latency, memory, parameters, optimization and all-attempt GPU cost.
  constraints:
  - At most five percent degradation of the 0.2-second trajectory score relative to matched B0.
  - At most five percent joint-position and endpoint joint-velocity RMSE degradation at each of one, two and five
    seconds relative to matched B0; also report comparison with B1.
  - At most two percentage points added thirty-second autonomous instability and ten percent command-tracking degradation,
    with no increased numerical divergence.
  - At most twenty percent model-p95 latency overhead relative to matched B0 and policy-plus-model p95 below twenty
    milliseconds on the same GPU type and dtype.
  - No policy retraining, changed normalization, forecast-horizon change or neural C/D extension in the initial
    campaign.
  paired_factors:
  - training_seed
  - evaluation_partition
  - episode_id
  - fork_step
  - horizon_steps
  - mode
  population: one fixed fork per held-out episode; 256 planned episode IDs per partition
  seeds:
  - 7301
  - 7302
  scenarios: []
  levels: []
  difficulties: []
  num_envs: 256
  num_episodes: 1
  episode_sampling: first_episode_per_env
  profile: world_model
  metric_reducers: {}
  artifact_metrics:
    failure_aware_recorded_action_physical_trajectory_nrmse_2s:
      source: scored_rows.json
      columns:
      - failure_aware_score
      - physical_trajectory_nrmse
      selection:
        mode: A
        partition: test_id
        horizon_steps: 100
    Finite-pair trajectory score and all physical components at 0.2/1/2/5/10/30 seconds.:
      source: scored_rows.json
      columns:
      - failure_aware_score
      - physical_trajectory_nrmse
      - reference_eligible
      - prediction_finite
      - initialization_valid
      - horizon_steps
      selection: {}
    Joint-position and endpoint joint-velocity RMSE separately; body linear/angular velocity and pose accuracy.:
      source: scored_rows.json
      columns:
      - joint_position_rmse_rad
      - joint_velocity_rmse_rad_s
      - linear_velocity_rmse_m_s
      - angular_velocity_rmse_rad_s
      - translation_rmse_m
      - orientation_rmse_rad
      selection: {}
    Direct/residual main effect, integration main effect and their interaction, each per fresh training seed.:
      source: scored_rows.json
      columns:
      - variant
      - training_seed
      - episode_id
      - failure_aware_score
      - physical_trajectory_nrmse
      selection: {}
    Autonomous policy outcomes and candidate-specific action-matched simulator shadows, with distinct interpretations.:
      source: scored_rows.json
      columns:
      - mode
      - failure_aware_score
      - command_tracking_linear_rmse
      - command_tracking_yaw_rmse
      - unstable
      selection: {}
    First major error, error growth, stability duration, command tracking and numerical divergence.:
      source: scored_rows.json
      columns:
      - exact_fidelity_duration_s
      - stable_duration_s
      - numerical_divergence
      - failure_aware_score
      - horizon_steps
      selection: {}
    Model and policy-plus-model latency, memory, parameters, optimization and all-attempt GPU cost.:
      source: provenance.json
      columns:
      - model_latency_p95_ms
      - policy_plus_model_latency_p95_ms
      - peak_allocated_memory_bytes
      selection:
        mode: A
        partition: test_id
  world_model_design:
    horizons_steps:
    - 10
    - 50
    - 100
    - 250
    - 500
    - 1500
    horizons_seconds:
    - 0.2
    - 1
    - 2
    - 5
    - 10
    - 30
    roles:
    - short_dynamics
    - initial_autonomous
    - medium_fidelity
    - long_accuracy
    - extended_accuracy
    - stability_stress
    levels: []
    difficulties: []
    partitions:
    - test_id
    - test_command_shift
    population: one fixed fork per held-out episode; 256 planned episode IDs per partition
    modes:
      A: same recorded future departure actions for every model, open loop after the initial history
      B: Same frozen actor and initial history, each model's predicted observation drives its own future actions.
        Compare with a simulator branch using the same frozen actor on true observations. Report trajectory gaps
        as closed-loop outcome discrepancies, never as identical-action prediction errors.
      B_shadow: Replay each B branch's complete generated action sequence in the simulator, reconstructed by deterministic
        replay of the identical pre-fork prefix. Compare that model with its own action-matched simulator reference;
        do not rank these as though every variant received the same future action sequence.
    no_future_corrections: no periodic history refresh, pose alignment, true contacts or simulator state injection
      after the fork
    alignment: One initial translation and yaw alignment only. Compute initial tilt from measured gravity, then
      integrate. Apply the initial transform once to the entire trajectory. Score COM translation against ground-truth
      COM; score link translation separately using fixed nominal COM offset. Ground-plane height is not observable
      from this input and is not a model correction.
    physical_score: 'For each fork and K, sqrt(mean over k=1..K of mean of six blocks: ||p_COM_hat-p_COM||^2/(1
      m)^2; geodesic(R_hat,R)^2/(1 rad)^2; ||v_body_hat-v_body||^2/(1 m/s)^2; ||omega_body_hat-omega_body||^2/(1
      rad/s)^2; mean_j (q_hat-q)^2/(0.5 rad)^2; mean_j (qdot_hat-qdot)^2/(5 rad/s)^2)). Average forks equally within
      partition and seed, then seeds equally.'
    physical_metrics:
    - COM_and_link_translation_RMSE_m
    - orientation_geodesic_RMSE_rad
    - roll_pitch_error_rad
    - gravity_RMSE
    - body_linear_velocity_RMSE_m_s
    - body_angular_velocity_RMSE_rad_s
    - joint_position_RMSE_rad
    - joint_velocity_RMSE_rad_s
    - torque_RMSE_Nm
    - per_fork_trajectory_NRMSE_p90_p95
    consistency_metrics:
    - joint_endpoint_integration_defect_rad
    - gravity_transport_defect
    - gravity_norm_error
    - gravity_versus_pose_defect
    - quaternion_norm_error
    - R_transpose_R_error
    - determinant_R_error
    - joint_limit_excess_rad
    - contact_transition_F1
    - nominal_plane_FK_foot_penetration_m
    - predicted_support_foot_speed_m_s
    behaviour_metrics:
    - linear_and_yaw_command_tracking_RMSE
    - gait_frequency_Hz
    - per_leg_phase_error_without_time_warp
    - joint_amplitude_error
    - foot_contact_duty_factor
    - unstable_fraction
    - numerical_divergence_fraction
    - stable_duration_s
    - exact_fidelity_duration_s
    instability: First nonfinite prediction, absolute roll or pitch above pi/3 for five consecutive steps, or any
      joint exceeding its hard asset limit by 0.25 rad for five consecutive steps. Report predicted base-contact
      events separately (threshold sigmoid >= 0.5), and do not equate that label with true falls.
    fidelity_duration: first time physical trajectory NRMSE exceeds 1.0 for ten consecutive steps; descriptive threshold
      only
    censoring: Stop exact physical metrics at the first true reference termination; never compare against a post-reset
      state. Report each horizon's eligible and finite denominators, initialized population, failures, and paired
      common support. Model-invalid values are failures, never silently excluded as complete cases. Report the failure-aware
      capped physical score (cap 10, including invalid model samples) alongside finite-pair RMSE. Support requires
      no increased failure rate and improvement in both views. Initial/reference failure is not assigned zero error.
      Thirty-second stability is always reported separately.
    footprint_diagnostic_limit: Relative plane penetration uses the initial plane offset for scoring only; absent
      root height makes absolute terrain contact underobserved. Label nominal geometry and gravity-only support
      proxies explicitly; neither proves force balance.
    baseline_pose_readout: For B0, use the same angular-velocity integration for primary pose scoring; additionally
      report gravity-derived tilt with integrated yaw as a separate state-readout diagnostic. Never privilege one
      variant with a different pose integrator.
    efficiency: One specified device/dtype, warm 1000 calls, time 10000 steps with synchronization; report median/p95/p99
      batch-one model and model-plus-frozen-policy latency, batch-256 throughput, peak allocated memory, training
      wall time and GPU-hours. Render cost and collection cost separately. No simulator loaded in neural timing.
  videos:
    reuse: existing model parsing, articulated assets, command arrows and plotting conventions
    required_boundary: learned states and deterministic kinematics only; kinematic mesh playback must never call
      sim.step to evolve predictions
    state_source: immutable saved scored trajectories, timestamps, episode IDs, action sequences and checkpoint
      digests
    selection: Fixed ID episodes0/64/128/192, training seed33, A/B; add worst B0 two-second eligible episode and
      preserve failures; seed44 every variant gets episode0 A.
    outputs:
    - time_aligned_actual_imagined_articulation
    - translation_and_geodesic_error_curves
    - joint_angle_velocity_curves
    - consistency_versus_horizon
    - side_by_side_B0_B1_B2_D1_E3_direct
    intervention_control: B0_visual must change only displayed pose, never future state or policy observations
    future_interface: time_s, local_position, quaternion_wxyz, physical_joint_angles, physical_joint_velocities,
      joint_names, command, raw_action, contact_logits, failure_flags
minimum_meaningful_effect:
  primary_relative_reduction: 0.2
  mean_1_2_5s_relative_reduction: 0.15
  autonomous_shadow_2s_relative_reduction: 0.15
  aggregation: Equal-weight mean of the two fresh seed-relative paired effects; both seed effects improve, as the
    retained descriptive engineering rule, not a population robustness claim.
cost_accounting:
- allocated GPU-seconds from all existing queue event logs, conservatively rounded, independently per device
- training updates and windows
- collection transitions
- evaluation forks and stochastic sample streams
- wall time, peak memory, latency, throughput and video rendering cost
